# MarketingOS — production reverse proxy (Nginx)
#
# Place at /etc/nginx/sites-available/marketingos, symlink into
# sites-enabled, then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d marketing.example.com
#
# The Node server listens on 127.0.0.1:3000 (see docker-compose.prod.yml).
# Replace marketing.example.com with the hostname that matches
# NEXT_PUBLIC_SITE_URL.

# ── Rate limiting ────────────────────────────────────────────────────────────
# Login and OTP endpoints are additionally rate-limited in the application;
# this edge limit protects the whole surface from trivial floods.
limit_req_zone $binary_remote_addr zone=marketingos_api:10m rate=20r/s;

upstream marketingos_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name marketing.example.com;

    # certbot writes the ACME challenge location here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name marketing.example.com;

    # Managed by certbot.
    ssl_certificate     /etc/letsencrypt/live/marketing.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketing.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security headers ────────────────────────────────────────────────────
    # The app also sets these (next.config.ts); duplicating them at the edge
    # covers static assets and error pages.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    server_tokens off;

    # Uploads go through the Node body parser; keep the edge limit generous.
    client_max_body_size 25m;

    gzip on;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;
    gzip_min_length 1024;

    # Immutable build assets.
    location /_next/static/ {
        proxy_pass http://marketingos_app;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # API: no proxy caching, no request buffering surprises.
    location /api/ {
        limit_req zone=marketingos_api burst=40 nodelay;
        proxy_pass http://marketingos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://marketingos_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
