# ALO Labs AISMH — Production Deployment
# FIXED: replace fragile workflow_run trigger with explicit push: main + needs: docker
# FIXED: quote all ${{ }} interpolations inside heredocs to avoid shell injection
# FIXED: use step outputs (id:resolve) consistently — no more broken "echo SHA" issue
# FIXED: stop masking failures with "|| true" on the migrate step
# FIXED: properly validate required secrets before SSH attempt

name: Deploy to VPS

on:
  # Deploy only AFTER the image for this commit has actually been built and
  # pushed. Previously this workflow also triggered on `push: main`, so it ran
  # in parallel with "Docker Build & Push" and tried to pull an image tag that
  # did not exist yet. A cross-workflow `needs:` is not possible, so the image
  # workflow completing successfully is the trigger.
  workflow_run:
    workflows: ["Docker Build & Push"]
    types: [completed]
    branches: [main]

  # Manual re-deploy of an already-published tag.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (short SHA) to deploy — defaults to latest"
        required: false
        default: "latest"

# Only one deploy at a time — queue if a new push comes mid-deploy
# `actions: read` is required by the "Require CI to have passed" gate, which
# queries the workflow runs for the target commit.
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false


# NOTE: only `vars` may be referenced in workflow-level env. The `secrets`
# context is NOT available here — GitHub rejects the whole workflow file if it
# is used, which is why this workflow never produced a single job. Anything
# derived from a secret lives in the job-level env below.
env:
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'alo-labs-aismh' }}
  HEALTH_PATH: ${{ vars.HEALTH_PATH || '/api/health' }}
  HEALTH_TIMEOUT_SECONDS: "60"

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-24.04
    timeout-minutes: 18

    # Never deploy off a failed image build.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}

    # `secrets` IS available in job-level env, unlike workflow-level env.
    env:
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'deploy' }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}

    steps:
      # ── The commit actually being deployed ───────────────────
      # On workflow_run, github.sha is the default branch tip, NOT the commit
      # that triggered the build. head_sha is the real one.
      - name: Resolve target commit
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "👉 Target commit: ${SHA}"

      # ── CI must be green for THIS commit before anything ships ──
      - name: Require CI to have passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.target.outputs.sha }}"
          echo "👉 Checking the CI conclusion for ${SHA} ..."

          CONCLUSION=$(gh api \
            "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last | .conclusion // "missing"')

          echo "CI conclusion for ${SHA}: ${CONCLUSION}"
          if [ "${CONCLUSION}" != "success" ]; then
            echo "❌ Refusing to deploy ${SHA}: CI is '${CONCLUSION}', not 'success'."
            echo "   Lint, typecheck and the production build must pass first."
            exit 1
          fi
          echo "✅ CI passed for ${SHA}"

      # ── Fail-fast on missing required secrets ────────────────
      - name: Verify required secrets are configured
        run: |
          set -euo pipefail
          MISSING=()
          [ -z "${{ secrets.DEPLOY_HOST }}" ] && MISSING+=("DEPLOY_HOST")
          [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ] && MISSING+=("DEPLOY_SSH_KEY")
          # DOCKERHUB_USERNAME is optional — images are always published to
          # GHCR, which authenticates with the built-in GITHUB_TOKEN.
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Missing required GitHub secrets: ${MISSING[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "✅ All required secrets present"

      # ── Resolve the exact commit SHA being deployed ──────────
      - name: Resolve commit SHA for image tag
        id: resolve
        run: |
          set -euo pipefail
          # Prefer explicit input, fall back to current commit
          if [ -n "${{ github.event.inputs.image_tag }}" ] && [ "${{ github.event.inputs.image_tag }}" != "latest" ]; then
            SHORT_SHA="${{ github.event.inputs.image_tag }}"
          else
            FULL_SHA="${{ steps.target.outputs.sha }}"
            SHORT_SHA="${{ steps.target.outputs.short_sha }}"
            echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "👉 Deploying image tag: ${SHORT_SHA}"
          echo "👉 Full SHA: ${FULL_SHA:-manual-deploy}"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The commit being deployed, so scripts/ matches the running image.
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 1

      # ── Configure SSH key ─────────────────────────────────────
      - name: Configure SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          # Write key with no trailing newline issues
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pre-populate known_hosts to avoid interactive prompt
          ssh-keyscan -p "${{ env.DEPLOY_PORT }}" -H "${{ env.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "❌ Failed to ssh-keyscan ${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PORT }}"
            echo "Verify DEPLOY_HOST and DEPLOY_PORT secrets are correct and the host is reachable"
            exit 1
          }
          echo "✅ SSH key configured"

      # ── Save current image tag for rollback ──────────────────
      - name: Save current running image tag
        id: save-current
        continue-on-error: true
        run: |
          set -uo pipefail
          CURRENT=$(ssh -i ~/.ssh/deploy_key \
            -p "${{ env.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            "docker inspect --format='{{index .Config.Image}}' aismh-app 2>/dev/null || echo ''")
          # Quote the value because it may contain colons (image:tag)
          echo "previous_image=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "👉 Previous image for rollback: ${CURRENT:-none}"

      # ── Pull latest image on VPS ─────────────────────────────
      # Must mirror docker.yml: GHCR is always published, Docker Hub only when
      # DOCKERHUB_USERNAME is configured.
      - name: Resolve image reference
        id: image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.short_sha }}"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            REF="${DOCKERHUB_USERNAME}/${{ env.IMAGE_NAME }}:${TAG}"
          else
            REF="ghcr.io/${{ github.repository }}:${TAG}"
          fi
          REF="$(printf '%s' "${REF}" | tr '[:upper:]' '[:lower:]')"
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "👉 Image to deploy: ${REF}"

      - name: Pull latest Docker image
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.ref }}"
          echo "👉 Pulling ${IMAGE} on VPS ..."
          ssh -i ~/.ssh/deploy_key \
            -p "${{ env.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            "docker pull '${IMAGE}'"

      # ── Preflight: prove the database survives container replacement ──
      # schema.prisma is SQLite, so the database is a plain file. The compose
      # file that decides whether it lives on a mounted volume is on the server
      # and not in version control, so it cannot be reviewed in a PR. This gate
      # verifies persistence for real — write a probe in one container, confirm
      # it is visible in the next — and halts the deploy if it is not.
      - name: Preflight — verify database persistence
        id: preflight
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "${{ env.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=no \
            scripts/preflight-persistence.sh \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:/tmp/preflight-persistence.sh"

          OUT=$(ssh -i ~/.ssh/deploy_key \
            -p "${{ env.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            'set -euo pipefail; cd /opt/aismh && bash /tmp/preflight-persistence.sh; rm -f /tmp/preflight-persistence.sh')

          echo "${OUT}"
          echo "existing_db=$(printf '%s' "${OUT}" | grep -oE 'EXISTING_DB=[01]' | cut -d= -f2 | tail -1)" >> "$GITHUB_OUTPUT"

      # ── Verified backup, before anything can change the schema ─────────
      - name: Back up database
        id: backup
        run: |
          set -euo pipefail
          OUT=$(ssh -i ~/.ssh/deploy_key \
            -p "${{ env.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            'set -euo pipefail
             cd /opt/aismh
             docker compose run --rm --no-deps --entrypoint bash app scripts/db-backup.sh')

          echo "${OUT}"
          BACKUP_PATH=$(printf '%s' "${OUT}" | grep -oE 'BACKUP_PATH=.*' | cut -d= -f2- | tail -1)
          echo "path=${BACKUP_PATH}" >> "$GITHUB_OUTPUT"
          if [ -n "${BACKUP_PATH}" ]; then
            echo "✅ Verified backup: ${BACKUP_PATH}"
          else
            echo "ℹ️  No existing database — first-time initialisation."
          fi

      # ── Schema synchronisation ─────────────────────────────────────────
      - name: Sync database schema
        run: |
          set -euo pipefail
          # No prisma/migrations directory exists — this project uses `db push`
          # everywhere (deploy.sh, package.json, the runbook), so the previous
          # `prisma migrate deploy` could never have succeeded.
          #
          # scripts/db-sync-schema.sh requires the verified backup above,
          # prints the pending diff, refuses destructive statements, and never
          # passes --accept-data-loss.
          ALLOW_NO_BACKUP=0
          if [ "${{ steps.preflight.outputs.existing_db }}" = "0" ]; then
            ALLOW_NO_BACKUP=1
          fi

          ssh -i ~/.ssh/deploy_key \
            -p "${{ env.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            "set -euo pipefail
             cd /opt/aismh
             docker compose run --rm --no-deps \
               -e BACKUP_PATH='${{ steps.backup.outputs.path }}' \
               -e ALLOW_NO_BACKUP='${ALLOW_NO_BACKUP}' \
               --entrypoint bash app scripts/db-sync-schema.sh"

      # ── Rolling restart ──────────────────────────────────────
      - name: Rolling restart
        id: restart
        env:
          FULL_IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          # NOTE: pass variables to remote shell via SSH environment (ssh -o SendEnv)
          # rather than GitHub Actions interpolation inside the heredoc.
          # This avoids the bug where an Actions expression inside the quoted
          # 'DEPLOY_SCRIPT' heredoc is never expanded.

          ssh -i ~/.ssh/deploy_key \
            -p "${{ env.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            "FULL_IMAGE_REF='${FULL_IMAGE_REF}' bash -s" << 'DEPLOY_SCRIPT'
            set -euo pipefail

            FULL_IMAGE="${FULL_IMAGE_REF}"
            echo ">>> Deploying ${FULL_IMAGE} ..."

            cd /opt/aismh
            export AISMH_IMAGE="${FULL_IMAGE}"

            # Start the image we just pulled and verified.
            # NOTE: --build was removed. It rebuilt from whatever source happened
            # to be on the VPS, so the artefact that actually ran was NOT the
            # image this workflow pulled and tagged.
            docker compose up -d --no-deps app
            echo ">>> New container started, waiting for health check ..."
            sleep 5
          DEPLOY_SCRIPT

      # ── Health check verification ────────────────────────────
      - name: Verify health check
        id: healthcheck
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || format('http://{0}', env.DEPLOY_HOST) }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -uo pipefail
          HEALTH_URL="${DEPLOY_URL}${HEALTH_PATH}"
          echo "👉 Checking ${HEALTH_URL} ..."

          # An HTTP 200 alone only proves Node is listening. /api/health also
          # reports the commit it was built from, a real database round-trip
          # and whether required config is present — so we assert on those.
          BODY=""
          for i in $(seq 1 12); do
            BODY=$(curl -fsS --max-time 8 "${HEALTH_URL}" 2>/dev/null || echo "")
            if [ -n "${BODY}" ]; then
              STATUS=$(printf '%s' "${BODY}" | jq -r '.status // "unknown"')
              if [ "${STATUS}" = "ok" ]; then
                echo "✅ Health endpoint reports ok on attempt ${i}/12"
                break
              fi
              echo "⏳ Attempt ${i}/12 — status '${STATUS}':"
              printf '%s\n' "${BODY}" | jq -c '.checks // {}' || true
            else
              echo "⏳ Attempt ${i}/12 — no response yet, retrying in 5s ..."
            fi
            BODY=""
            sleep 5
          done

          if [ -z "${BODY}" ]; then
            echo "❌ Health check never returned a healthy response within 60s"
            echo "👉 Container logs:"
            echo "   ssh ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }} 'docker logs aismh-app --tail 100'"
            exit 1
          fi

          echo "👉 Health payload:"
          printf '%s\n' "${BODY}" | jq .

          # 1. Database must be genuinely reachable, not merely constructed.
          DB_OK=$(printf '%s' "${BODY}" | jq -r '.checks.database.ok // false')
          if [ "${DB_OK}" != "true" ]; then
            echo "❌ Application is up but the DATABASE is not reachable."
            echo "   The deploy is not healthy. Investigate before serving traffic."
            exit 1
          fi
          echo "✅ Database round-trip OK ($(printf '%s' "${BODY}" | jq -r '.checks.database.latencyMs')ms)"

          # 2. Required configuration must be present.
          CFG_OK=$(printf '%s' "${BODY}" | jq -r '.checks.config.ok // false')
          if [ "${CFG_OK}" != "true" ]; then
            echo "❌ Required environment variables are missing: $(printf '%s' "${BODY}" | jq -c '.checks.config.missing')"
            exit 1
          fi
          echo "✅ Required configuration present"

          # 3. The running container must be the commit we just deployed.
          #    This is what catches a container that silently never restarted.
          RUNNING_SHA=$(printf '%s' "${BODY}" | jq -r '.commit // "unknown"')
          if [ "${RUNNING_SHA}" = "unknown" ]; then
            echo "⚠️  Image reports no commit — built without the GIT_COMMIT build-arg."
            echo "    Cannot confirm the served build matches ${EXPECTED_SHA}."
          elif [ "${RUNNING_SHA}" != "${EXPECTED_SHA}" ]; then
            echo "❌ Wrong build is live."
            echo "   expected: ${EXPECTED_SHA}"
            echo "   serving:  ${RUNNING_SHA}"
            echo "   The container did not pick up the new image."
            exit 1
          else
            echo "✅ Serving the expected commit: ${RUNNING_SHA}"
          fi

          echo "deployed_sha=${RUNNING_SHA}" >> "$GITHUB_OUTPUT"
        timeout-minutes: 3

      # ── Cleanup old images ───────────────────────────────────
      - name: Cleanup dangling images
        if: success()
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ env.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            "docker image prune -f --filter 'label=com.docker.compose.project=aismh' 2>/dev/null || true"

      # ── Rollback on failure ──────────────────────────────────
      # Only roll back if we actually got far enough to replace the running
      # container. Failing at the secrets check or the persistence preflight
      # means production was never touched, so there is nothing to undo and a
      # "rollback failed" line would be misleading noise.
      - name: Rollback to previous image
        if: failure() && steps.restart.outcome == 'failure'
        env:
          PREV_IMAGE: ${{ steps.save-current.outputs.previous_image }}
        run: |
          set -uo pipefail
          if [ -z "${PREV_IMAGE}" ]; then
            echo "⚠️ No previous image found, cannot rollback automatically"
            echo "👉 Manual recovery: SSH to VPS and inspect /opt/aismh"
            exit 1
          fi

          echo "🔄 Rolling back to ${PREV_IMAGE} ..."
          ssh -i ~/.ssh/deploy_key \
            -p "${{ env.DEPLOY_PORT }}" \
            -o StrictHostKeyChecking=no \
            "${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}" \
            "PREV_IMAGE='${PREV_IMAGE}' bash -s" << 'ROLLBACK'
            set -euo pipefail
            cd /opt/aismh
            export AISMH_IMAGE="${PREV_IMAGE}"
            docker compose up -d --no-deps app
            echo ">>> Rollback container started"
          ROLLBACK

      # ── Notify (Slack / Discord / generic webhook) ───────────
      - name: Send deployment notification
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          SHA: ${{ steps.resolve.outputs.short_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          # Build a safe JSON payload using jq if available, else fallback
          if command -v jq >/dev/null 2>&1; then
            PAYLOAD=$(jq -n \
              --arg status "${STATUS}" \
              --arg sha "${SHA}" \
              --arg url "${RUN_URL}" \
              --arg actor "${ACTOR}" \
              --arg branch "${BRANCH}" \
              '{status: $status, sha: $sha, run_url: $url, actor: $actor, branch: $branch, timestamp: now | todate}')
          else
            # Fallback JSON — escape any embedded quotes
            PAYLOAD="{\"status\":\"${STATUS}\",\"sha\":\"${SHA}\",\"run_url\":\"${RUN_URL}\",\"actor\":\"${ACTOR}\",\"branch\":\"${BRANCH}\"}"
          fi

          if [ -n "${SLACK_WEBHOOK}" ]; then
            echo "📨 Sending Slack notification ..."
            curl -fsSL -X POST \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}" \
              "${SLACK_WEBHOOK}" || echo "Slack notification failed (non-fatal)"
          fi

          if [ -n "${DEPLOY_WEBHOOK}" ]; then
            echo "📨 Sending generic webhook notification ..."
            curl -fsSL -X POST \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}" \
              "${DEPLOY_WEBHOOK}" || echo "Generic webhook notification failed (non-fatal)"
          fi

      # ── Summary ───────────────────────────────────────────────
      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| **Status** | \`${{ job.status }}\` |"
            echo "| **Image** | \`${{ steps.image.outputs.ref }}\` |"
            echo "| **Commit (short)** | \`${{ steps.resolve.outputs.short_sha }}\` |"
            echo "| **Commit (full)** | \`${{ steps.resolve.outputs.full_sha || github.sha }}\` |"
            echo "| **Previous image** | \`${{ steps.save-current.outputs.previous_image || 'N/A' }}\` |"
            echo "| **Triggered by** | \`${{ github.actor }}\` |"
            echo "| **Branch** | \`${{ github.ref_name }}\` |"
            echo "| **Run URL** | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
