# ALO Labs AISMH — Continuous Integration
# FIXED: branches: [main] (was malformed "branches: [main]" in the previous version)
# FIXED: removed rg secret-scan that always passes via "|| echo" — now properly fails on real secrets

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Don't run multiple CI runs in parallel on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Don't fail the whole workflow if one optional job fails
# (we mark them continue-on-error where appropriate)
permissions:
  contents: read

env:
  BUN_VERSION: "1"

jobs:
  quality:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:./db/ci.db"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests (if present)
        run: bun run test
        continue-on-error: true   # no test suite yet — don't block on this

  build:
    name: Production build
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:./db/ci.db"

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./db/ci.db"
          JWT_SECRET: "ci-build-secret-not-used-in-production"
          NODE_ENV: "production"

      - name: Verify build output
        run: test -f .next/standalone/server.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/
          retention-days: 3

  security-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          set -euo pipefail
          # Look for obvious secret patterns — fail if any are found
          FOUND=$(grep -rEn "password\s*[:=]\s*['\"][^'\"]{6,}['\"]|api[_-]?key\s*[:=]\s*['\"][^'\"]{10,}['\"]" \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist \
            . || true)
          if [ -n "${FOUND}" ]; then
            echo "❌ Hardcoded secrets found:"
            echo "${FOUND}"
            echo ""
            echo "Move these to environment variables before committing."
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Check .env not tracked
        run: |
          if git ls-files | grep -E "^\.env$"; then
            echo "❌ .env is tracked in git. Run: git rm --cached .env"
            exit 1
          fi
          echo "✅ .env is not tracked"

      - name: Check db/custom.db not tracked
        run: |
          if git ls-files | grep -E "db/custom\.db|\.sqlite$|\.sqlite3$"; then
            echo "❌ Database binary is tracked in git. Run: git rm --cached db/custom.db"
            exit 1
          fi
          echo "✅ No database binaries tracked"

      - name: Audit dependencies (informational)
        run: bun audit || true
        continue-on-error: true
