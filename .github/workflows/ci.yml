name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: "file:./db/ci.db"
      - run: npm run lint
      - run: npm run typecheck
        continue-on-error: true
      - run: npm test
        continue-on-error: true

  build:
    name: Production build
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: "file:./db/ci.db"
      - run: npm run build
        env:
          DATABASE_URL: "file:./db/ci.db"
          JWT_SECRET: "ci-build-secret-not-used-in-production"
          VAULT_MASTER_KEY: "ci-build-vault-key-not-used-in-production"
          ADMIN_SEED_EMAIL: "admin@test.com"
          ADMIN_SEED_PASSWORD: "ci-test-password-not-real"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3055"
          NEXT_PUBLIC_APP_URL: "http://localhost:3055"
          NODE_ENV: "production"
      - run: test -f .next/standalone/server.js
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/
          retention-days: 3

  security-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check for hardcoded secrets
        run: |
          set -euo pipefail
          FOUND=$(grep -rEn "password\s*[:=]\s*['\"][^'\"]{6,}['\"]|api[_-]?key\s*[:=]\s*['\"][^'\"]{10,}['\"]" \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist \
            --exclude-dir=upload --exclude-dir=marketingos --exclude-dir=mini-services --exclude-dir=examples --exclude-dir=scripts \
            . || true)
          if [ -n "${FOUND}" ]; then
            echo "❌ Hardcoded secrets found:"
            echo "${FOUND}"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"
      - name: Check .env not tracked
        run: |
          if git ls-files | grep -E "^\.env$"; then exit 1; fi
          echo "✅ .env is not tracked"
      - name: Check db not tracked
        run: |
          if git ls-files | grep -E "db/custom\.db|\.sqlite$"; then exit 1; fi
          echo "✅ No database binaries tracked"
