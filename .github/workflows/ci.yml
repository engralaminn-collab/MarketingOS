name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1"

jobs:
  quality:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            .bun
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:./db/ci.db"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck
        continue-on-error: true

      - name: Run tests
        run: bun run test
        continue-on-error: true

  build:
    name: Production build
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate
        env:
          DATABASE_URL: "file:./db/ci.db"

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./db/ci.db"
          JWT_SECRET: "ci-build-secret-not-used-in-production"
          VAULT_MASTER_KEY: "ci-build-vault-key-not-used-in-production"
          ADMIN_SEED_EMAIL: "admin@test.com"
          ADMIN_SEED_PASSWORD: "ci-test-password-not-real"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3055"
          NEXT_PUBLIC_APP_URL: "http://localhost:3055"
          NODE_ENV: "production"

      - name: Verify build output
        run: test -f .next/standalone/server.js

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone/
          retention-days: 3

  security-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          set -euo pipefail
          FOUND=$(grep -rEn "password\s*[:=]\s*['\"][^'\"]{6,}['\"]|api[_-]?key\s*[:=]\s*['\"][^'\"]{10,}['\"]" \
            --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist \
            --exclude-dir=upload --exclude-dir=marketingos --exclude-dir=mini-services --exclude-dir=examples --exclude-dir=scripts \
            . || true)
          if [ -n "${FOUND}" ]; then
            echo "❌ Hardcoded secrets found:"
            echo "${FOUND}"
            exit 1
          fi
          echo "✅ No hardcoded secrets found"

      - name: Check .env not tracked
        run: |
          if git ls-files | grep -E "^\.env$"; then
            echo "❌ .env is tracked in git"
            exit 1
          fi
          echo "✅ .env is not tracked"

      - name: Check db not tracked
        run: |
          if git ls-files | grep -E "db/custom\.db|\.sqlite$|\.sqlite3$"; then
            echo "❌ Database binary is tracked"
            exit 1
          fi
          echo "✅ No database binaries tracked"
