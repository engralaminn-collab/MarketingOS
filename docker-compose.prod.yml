# MarketingOS — reference production compose file
#
# ─────────────────────────────────────────────────────────────────────────────
# WHY THIS FILE EXISTS
# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/deploy.yml SSHes to the VPS and runs `docker compose` in
# /opt/aismh, against a compose file that lives only on that server and is not
# in version control. That makes the single most important production setting —
# whether the database survives a deployment — invisible to code review.
#
# This file is the reviewed reference. Reconcile /opt/aismh/docker-compose.yml
# with it. It is NOT applied automatically by any workflow.
#
# ─────────────────────────────────────────────────────────────────────────────
# THE CRITICAL PART: SQLITE PERSISTENCE
# ─────────────────────────────────────────────────────────────────────────────
# prisma/schema.prisma uses `provider = "sqlite"`. A SQLite database is a plain
# file. If that file lives inside the container's writable layer, it is
# destroyed every single time the image is replaced — i.e. on every deploy.
#
# The `db` bind mount below is what prevents that. DATABASE_URL must point
# inside it. Do not move the database out of the mounted path.
# ─────────────────────────────────────────────────────────────────────────────

services:
  app:
    # Set by deploy.yml: export AISMH_IMAGE="<user>/<image>:<sha>"
    image: ${AISMH_IMAGE:-alo-labs-aismh:latest}
    container_name: aismh-app
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

      # Absolute path inside the mounted volume below.
      # `db/custom.db` is the project convention: deploy.sh uses
      # file:./db/custom.db and tests/database-runtime-build.sh asserts an
      # absolute file: URL ending in db/custom.db.
      DATABASE_URL: "file:/app/db/custom.db"

      # ── Secrets ────────────────────────────────────────────────────────────
      # Supplied from the host environment or a .env file that is root-owned
      # and chmod 600. Never commit real values, and never bake them into the
      # image. `${VAR:?message}` makes compose refuse to start if one is unset,
      # which is far safer than booting with an empty signing key.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set on the host}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}

      # Self-hosted Ollama is the default text provider; no paid API fallback.
      # docker-compose.local-ai.yml supplies the private `ollama` service.
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}

      # Optional private ComfyUI endpoint for self-hosted image generation.
      # The ComfyUI service/model is operated separately; no model is bundled.
      COMFYUI_BASE_URL: ${COMFYUI_BASE_URL:-}
      COMFYUI_IMAGE_CHECKPOINT: ${COMFYUI_IMAGE_CHECKPOINT:-}
      COMFYUI_API_KEY: ${COMFYUI_API_KEY:-}
      COMFYUI_VIDEO_WORKFLOW_FILE: ${COMFYUI_VIDEO_WORKFLOW_FILE:-}
      COMFYUI_VIDEO_FPS: ${COMFYUI_VIDEO_FPS:-12}
      COMFYUI_VIDEO_WIDTH: ${COMFYUI_VIDEO_WIDTH:-768}
      COMFYUI_VIDEO_HEIGHT: ${COMFYUI_VIDEO_HEIGHT:-512}

      # Optional OpenAI-compatible self-hosted TTS. No automatic paid fallback.
      LOCAL_TTS_BASE_URL: ${LOCAL_TTS_BASE_URL:-}
      LOCAL_TTS_MODEL: ${LOCAL_TTS_MODEL:-tts-1}
      LOCAL_TTS_VOICE: ${LOCAL_TTS_VOICE:-default}
      LOCAL_TTS_API_KEY: ${LOCAL_TTS_API_KEY:-}

      # Hosted image/video/avatar/speech generation is explicitly opt-in.
      ZAI_MEDIA_ENABLED: ${ZAI_MEDIA_ENABLED:-false}
      ZAI_API_KEY: ${ZAI_API_KEY:-}

      # Optional provider credentials. Absent means the relevant feature
      # reports itself as unconfigured — it must never fake success.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}

    volumes:
      # Database. THIS is what makes the data survive a deploy.
      - ./db:/app/db
      # Written by scripts/db-backup.sh during deployment.
      - ./backups:/app/backups
      # Operator-provided ComfyUI API-format workflow files (optional, read-only).
      - ./comfy-workflows:/app/comfy-workflows:ro

    ports:
      # Bound to loopback only; the reverse proxy terminates TLS for
      # marketing.alolabs.net and forwards to this port.
      - "127.0.0.1:3000:3000"

    healthcheck:
      # Mirrors the HEALTHCHECK in the Dockerfile so compose and the deploy
      # workflow agree on what "healthy" means.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
