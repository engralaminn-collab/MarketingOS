version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3055:3055"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./db/production.db
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY:-change-me}
      - ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL:-admin@example.com}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD:-change-me}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3055}
    volumes:
      - app-db:/app/db
      - app-uploads:/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3055/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Uncomment when PostgreSQL is configured
